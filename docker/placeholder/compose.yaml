name: archive-placeholder
services:
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: /etc/archive-placeholder/auth
        target: /run/secrets/placeholder-auth
        read_only: true
        bind:
          create_host_path: false
      - tls_data:/data

volumes:
  tls_data:
