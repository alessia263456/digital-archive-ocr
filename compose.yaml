services:
  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      dockerfile: ../docker/frontend-test/Dockerfile
    volumes:
      - ./frontend/test-results:/app/test-results
      - ./backend/tests/Fixtures/rendering/romanian.png:/app/fixtures/romanian.png:ro
      - ./backend/tests/Fixtures/quarantine/synthetic-malformed.pdf:/app/fixtures/synthetic-malformed.pdf:ro

  ocr-worker:
    build:
      context: ./docker/ocr-worker
      additional_contexts:
        backend: service:backend
    environment:
      APP_KEY:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: archive
      DB_USERNAME: archive
      DB_PASSWORD: ${DB_PASSWORD:?Run ./scripts/ensure-local-env.sh to initialize local credentials}

  ocr-queue-worker:
    build:
      context: ./docker/ocr-worker
      additional_contexts:
        backend: service:backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: archive
      DB_USERNAME: archive
      DB_PASSWORD: ${DB_PASSWORD:?Run ./scripts/ensure-local-env.sh to initialize local credentials}
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 8100
      DOCUMENTS_DISK: ${DOCUMENTS_DISK:-r2}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_DEFAULT_REGION: ${R2_DEFAULT_REGION:-auto}
      R2_USE_PATH_STYLE_ENDPOINT: ${R2_USE_PATH_STYLE_ENDPOINT:-false}
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=3", "--tries=4", "--timeout=8040", "--no-interaction"]
    restart: unless-stopped
    volumes:
      - document-data:/app/storage/app/private/documents

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./scripts/ensure-local-env.sh to initialize local credentials}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/backend/init-test-database.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "archive", "-d", "archive"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173
      SESSION_DRIVER: database
      SESSION_LIFETIME: 30
      SESSION_EXPIRE_ON_CLOSE: "true"
      SESSION_ENCRYPT: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      SESSION_SECURE_COOKIE: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: archive
      DB_USERNAME: archive
      DB_PASSWORD: ${DB_PASSWORD:?Run ./scripts/ensure-local-env.sh to initialize local credentials}
      DB_QUEUE_RETRY_AFTER: 8100
      DOCUMENTS_DISK: ${DOCUMENTS_DISK:-r2}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_DEFAULT_REGION: ${R2_DEFAULT_REGION:-auto}
      R2_USE_PATH_STYLE_ENDPOINT: ${R2_USE_PATH_STYLE_ENDPOINT:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - document-data:/app/storage/app/private/documents

volumes:
  document-data:
  pgdata:
