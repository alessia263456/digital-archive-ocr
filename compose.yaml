services:
  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      dockerfile: ../docker/frontend-test/Dockerfile
    volumes:
      - ./frontend/test-results:/app/test-results

  ocr-worker:
    build:
      context: ./docker/ocr-worker
      additional_contexts:
        backend: service:backend
    environment:
      APP_KEY:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: archive
      DB_USERNAME: archive
      DB_PASSWORD: ${DB_PASSWORD:-}

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/backend/init-test-database.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "archive", "-d", "archive"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: archive
      DB_USERNAME: archive
      DB_PASSWORD:
      DOCUMENTS_DISK: ${DOCUMENTS_DISK:-r2}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_DEFAULT_REGION: ${R2_DEFAULT_REGION:-auto}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

volumes:
  pgdata:
