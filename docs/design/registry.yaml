# docs/design/registry.yaml — every screen and shared component, by DS- ID.
# Plans, commits, mocks and screenshots use the ID (tickets don't). kind: foundation | component | screen
# status: draft (awaiting approval, mock optional) | approved (confirmed in chat) | implemented | deprecated (never delete an entry)
designs:
  - id: DS-001
    name: "Listă documente / Căutare (Document list / Search results)"
    kind: screen
    status: draft
    roles: [admin, arhivar, cititor]
    decisions: [D-002, D-004, D-032, D-033]
    description: "Căutare full-text OCR (<2s), rezultate după relevanță cu evidențiere și numărul dosarului fizic. Consultare după dosar fizic, tip sau an, cu permisiuni pe dosar și rezultate anonimizate pentru cititor."

  - id: DS-002
    name: "Vizualizator document (Document viewer)"
    kind: screen
    status: approved
    design_ref: mocks/DS-002.html
    roles: [admin, arhivar, cititor]
    decisions: [D-004, D-032, D-038, D-022, D-033, D-034]
    description: "Consultare document în regim de citire, navigare între pagini, căutare în document, descărcare PDF și partajarea versiunii selectate pentru rolurile autorizate. Link cu expirare prestabilită sau personalizată și parolă opțională. Acces la Editor și la versiunile anterioare pentru admin și arhivar."

  - id: DS-003
    name: "Încărcare documente (Upload)"
    kind: screen
    status: approved
    roles: [admin, arhivar]
    design_ref: mocks/DS-003.html
    decisions: [D-002, D-032, D-038, D-025, D-026, D-028, D-040]
    description: "Încărcare independentă PDF și DOCX sau asamblarea unui document din imagini JPG și PNG ordonate. Previzualizarea ilustrează separat documentele în procesare, documentele gata de revizuit și ciornele de revizuire salvate explicit, cu o previzualizare a ultimelor trei ciorne. Revizuirea se deschide în DS-011, iar coada completă în DS-004."

  - id: DS-004
    name: "Coadă revizuire PII & Carantină (Human Review & Quarantine Queue)"
    kind: screen
    status: draft
    design_ref: mocks/DS-004.html
    roles: [admin, arhivar]
    decisions: [D-019, D-032, D-038, D-022, D-026]
    description: "File pentru revizuire și carantină, cu numărul de documente în fiecare coadă. Documentele procesate, inclusiv cele fără potriviri PII incerte, necesită revizuire umană în DS-011 înainte de aprobare. Carantină după patru încercări OCR eșuate (încercarea inițială și trei reîncercări), cu reîncercare manuală și confirmarea schimbării stării la eșuat definitiv."

  - id: DS-005
    name: "Retenție & Listă de casare (Retention & Destruction list)"
    kind: screen
    status: draft
    roles: [admin]
    decisions: [D-002, D-032, D-035]
    description: "Termene calculate de la data aplicabilă conform Nomenclatorului. Grupare după marcajul C.S., prelungirea termenului și confirmarea casării pe loturi."

  - id: DS-006
    name: "Panou administrare (Admin panel)"
    kind: screen
    status: draft
    roles: [admin]
    decisions: [D-017, D-032, D-033]
    description: "Gestiune conturi și permisiuni pentru cititor, acordate explicit pe dosar fizic. Permisiunea individuală are prioritate."

  - id: DS-007
    name: "Panou principal / Statistici (Dashboard)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-019, D-032, D-038, D-026, D-035]
    description: "Indicatori volum arhivă (documente, spațiu, scanuri), contor alerte revizuire PII și carantină, scadențe de retenție, flux activitate recentă."

  - id: DS-008
    name: "Jurnal de audit (Audit Log viewer)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-002, D-032, D-034, D-035]
    description: "Jurnal de audit imuabil pentru accesări, modificări, partajare și casare. Păstrează dovezile după casare și permite filtrarea după operator și perioadă. Admin și arhivar pot vedea, copia și revoca linkurile active."

  - id: DS-009
    name: "Vizualizator link public (Public share link viewer)"
    kind: screen
    status: draft
    design_ref: mocks/DS-009.html
    roles: [unauthenticated]
    decisions: [D-032, D-034]
    description: "Consultare și descărcare PDF pentru versiunea exactă selectată la partajare, prin link semnat cu expirare și parolă dacă a fost configurată. Titlul este Document partajat. Detaliile arhivistice apar doar în PDF."

  - id: DS-010
    name: "Autentificare (Login)"
    kind: screen
    status: draft
    roles: [unauthenticated]
    decisions: [D-017, D-018]
    description: "Ecran autentificare cu utilizator și parolă pentru personalul cabinetului notarial, mesaje de eroare exclusiv în limba română."

  - id: DS-011
    name: "Editor document & Anonimizare (Document Editor & Anonymization)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-004, D-032, D-038, D-022, D-035]
    description: "Corectare OCR, revizuire PII obligatorie, marcaje manuale și generare PDF anonimizat. Confirmarea metadatelor obligatorii și a datei aplicabile de retenție dacă este cunoscută. Data de retenție poate rămâne în așteptare. Indicativ derivat din clasificarea editabilă."

  - id: DS-012
    name: "Nomenclator arhivistic (Notarial Nomenclature)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-032, D-035, D-039]
    description: "Consultarea nomenclatorului complet, aplicarea reviziilor CSV oficiale și revizuirea regulilor aplicate documentelor deja aprobate."
