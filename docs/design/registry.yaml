# docs/design/registry.yaml — every screen and shared component, by DS- ID.
# Plans, commits, mocks and screenshots use the ID (tickets don't). kind: foundation | component | screen
# status: draft (awaiting approval, mock optional) | approved (confirmed in chat) | implemented | deprecated (never delete an entry)
designs:
  - id: DS-001
    name: "Căutare în arhivă (Archive search)"
    kind: screen
    status: implemented
    design_ref: mocks/DS-001.html
    roles: [admin, arhivar, cititor]
    decisions: [D-002, D-004, D-033, D-042]
    description: "M1a.1 implements the authenticated default home with the confirmed copy-only empty state for admin, arhivar and cititor. M1a.2 adds a DS-003 upload entry for admin and arhivar. Search, filters, collection browsing, recent documents and dossier permission views remain within P22-34."

  - id: DS-002
    name: "Vizualizator document (Document viewer)"
    kind: screen
    status: approved
    design_ref: mocks/DS-002.html
    roles: [admin, arhivar, cititor]
    decisions: [D-004, D-038, D-022, D-033, D-034, D-042]
    description: "Consultare document în regim de citire, navigare între pagini, căutare în document, descărcare PDF și partajarea versiunii selectate pentru rolurile autorizate. Link cu expirare prestabilită sau personalizată și parolă opțională. Acces la Editor și la versiunile anterioare pentru admin și arhivar."

  - id: DS-003
    name: "Încărcare documente (Upload)"
    kind: screen
    status: implemented
    roles: [admin, arhivar]
    design_ref: mocks/DS-003.html
    decisions: [D-002, D-038, D-025, D-026, D-028, D-040, D-042]
    description: "Admin și arhivar pot încărca mai multe documente PDF/DOCX cu rezultate individuale sau o singură colecție JPG/PNG cu pagini reordonabile. La deschiderea ecranului, Ciorne recente încarcă ultimele 50 de ciorne private în ordinea descrescătoare a creării. Starea OCR se actualizează la cerere. Ciornele gata de revizuit deschid rezultatele OCR auditate și previzualizarea privată în regim de citire. Editarea și aprobarea sunt prevăzute în DS-011."

  - id: DS-004
    name: "Coadă revizuire PII & Carantină (Human Review & Quarantine Queue)"
    kind: screen
    status: implemented
    design_ref: mocks/DS-004.html
    roles: [admin, arhivar]
    decisions: [D-019, D-038, D-022, D-026, D-042]
    description: "File pentru revizuire și carantină, cu numărul de documente în fiecare coadă. Documentele procesate, inclusiv cele fără potriviri PII incerte, necesită revizuire umană în DS-011 înainte de aprobare; până la implementarea DS-011, acțiunea deschide rezultatele OCR protejate existente. Carantină după patru încercări OCR eșuate (încercarea inițială și trei reîncercări), cu reîncercare manuală și confirmarea schimbării stării la eșuat definitiv. Capturile desktop/mobile în ambele teme sunt în docs/design/screens/DS-004.*.png."

  - id: DS-005
    name: "Retenție & Listă de casare (Retention & Destruction list)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-002, D-035, D-042]
    design_ref: mocks/DS-005.html
    description: "Admin are permisiuni de gestionare a termenelor și casării, inclusiv prelungirea termenului și confirmarea casării pe loturi. Arhivar are acces doar la citire: poate consulta și filtra termenele de păstrare și documentele eligibile pentru casare, fără a modifica termenele, aproba casarea sau efectua alte operațiuni de gestionare. Restricțiile arhivarului sunt impuse și pe server. Termenele expirate sunt grupate după marcajul C.S., cu aceleași condiții de selecție. Termenele urmează regulile aprobate din D-035; atingerea unui termen nu autorizează automat casarea. Pragul de 30 de zile este doar o grupare vizuală."

  - id: DS-006
    name: "Panou administrare (Admin panel)"
    kind: screen
    status: draft
    design_ref: mocks/DS-006.html
    roles: [admin]
    decisions: [D-017, D-033, D-042]
    description: "Gestiune conturi și permisiuni pentru cititor, acordate explicit pe dosar fizic. Permisiunea individuală are prioritate."

  - id: DS-007
    name: "Statistici (Statistics)"
    kind: screen
    status: approved
    design_ref: mocks/DS-007.html
    roles: [admin, arhivar]
    decisions: [D-035, D-038, D-033, D-042]
    description: "Conținut identic pentru admin și arhivar. Exact cinci secțiuni: (1) Total documente în arhivă: numărul documentelor aprobate din arhiva curentă; deschide DS-001 cu lista corespunzătoare. (2) Documente digitalizate: numărul documentelor aprobate după data aprobării, nu data încărcării sau finalizării OCR, fără numărarea versiunilor ori încercărilor; implicit «Luna aceasta», cu perioadele «Luna aceasta», «Luna trecută», «Anul acesta», «Toată perioada» și «Interval personalizat». Selectorul afectează doar acest indicator, iar clickul deschide DS-001 filtrat după documente aprobate și intervalul datei aprobării. (3) Documente pe tipuri: listă compactă cu tipurile reale de document definite de proiect și numărul documentelor aprobate din întreaga arhivă pentru fiecare; fiecare rând deschide DS-001 filtrat după tip. (4) Termene de păstrare: numărul documentelor cu termen depășit și numărul cu termen în următoarele 30 de zile; fiecare deschide DS-005 cu filtrul corespunzător, conform D-035; termenul nu autorizează automat casarea. (5) Documente digitalizate recent: cele mai recente cinci documente aprobate, în ordine descrescătoare după data aprobării, cu identificarea documentului, referința dosarului fizic și data aprobării; fiecare deschide DS-002 și există un link către toate documentele aprobate. Fără consum de spațiu, scanuri/pagini, statistici tehnice OCR, alerte de revizuire sau carantină, flux de audit, comparații, procente, grafice, număr de dosare fizice ori acțiuni rapide."

  - id: DS-008
    name: "Jurnal de audit (Audit Log viewer)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-002, D-034, D-035, D-042]
    description: "Jurnal de audit imuabil pentru accesări, modificări, partajare și casare. Păstrează dovezile după casare și permite filtrarea după operator și perioadă. Admin și arhivar pot vedea, copia și revoca linkurile active."

  - id: DS-009
    name: "Vizualizator link public (Public share link viewer)"
    kind: screen
    status: draft
    design_ref: mocks/DS-009.html
    roles: [unauthenticated]
    decisions: [D-034, D-042]
    description: "Consultare și descărcare PDF pentru versiunea exactă selectată la partajare, prin link semnat cu expirare și parolă dacă a fost configurată. Titlul este Document partajat. Detaliile arhivistice apar doar în PDF."

  - id: DS-010
    name: "Autentificare (Login)"
    kind: screen
    status: implemented
    design_ref: mocks/DS-010.html
    roles: [unauthenticated]
    decisions: [D-017, D-018]
    description: "Ecran autentificare cu utilizator și parolă pentru personalul cabinetului notarial, mesaje de eroare exclusiv în limba română."

  - id: DS-011
    name: "Editor document & Anonimizare (Document Editor & Anonymization)"
    kind: screen
    status: approved
    roles: [admin, arhivar]
    decisions: [D-004, D-038, D-022, D-035, D-042]
    description: "Corectare OCR, revizuire PII obligatorie, marcaje manuale și generare PDF anonimizat. Confirmarea metadatelor obligatorii și a datei aplicabile de retenție dacă este cunoscută. Data de retenție poate rămâne în așteptare. Indicativ derivat din clasificarea editabilă."
    design_ref: mocks/DS-011.html

  - id: DS-012
    name: "Nomenclator arhivistic (Notarial Nomenclature)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-035, D-039, D-042]
    description: "Consultarea nomenclatorului complet, aplicarea reviziilor CSV oficiale și revizuirea regulilor aplicate documentelor deja aprobate."
