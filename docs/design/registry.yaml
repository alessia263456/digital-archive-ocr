# docs/design/registry.yaml — every screen and shared component, by DS- ID.
# Plans, commits, mocks and board files use the ID (tickets don't). kind: foundation | component | screen
# status: draft (mock drawn) | approved (confirmed on the board) | implemented | deprecated (never delete an entry)
designs:
  - id: DS-001
    name: "Listă documente / Căutare (Document list / Search results)"
    kind: screen
    status: draft
    roles: [admin, arhivar, cititor]
    decisions: [D-002, D-004, D-020, D-023]
    description: "Căutare full-text OCR (<2s), rezultate după relevanță cu evidențiere și numărul dosarului fizic. Consultare după dosar fizic, tip sau an, cu permisiuni pe dosar și rezultate anonimizate pentru cititor."

  - id: DS-002
    name: "Vizualizator document (Document viewer)"
    kind: screen
    status: approved
    design_ref: mocks/DS-002.html
    roles: [admin, arhivar, cititor]
    decisions: [D-004, D-020, D-021, D-022, D-023, D-024]
    description: "Consultare document în regim de citire, navigare între pagini, căutare în document, descărcare PDF și partajarea versiunii selectate pentru rolurile autorizate. Link cu expirare prestabilită sau personalizată și parolă opțională. Acces la Editor și la versiunile anterioare pentru admin și arhivar."

  - id: DS-003
    name: "Încărcare documente (Upload)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-002, D-020, D-021, D-025, D-026, D-028]
    description: "Încărcare multiplă PDF, JPG, PNG și DOCX, cu OCR asincron și ciorne private. Hash-ul SHA-256 identic blochează salvarea. Numărul și data actului identice declanșează avertismentul de posibil duplicat."

  - id: DS-004
    name: "Coadă revizuire PII & Carantină (Human Review & Quarantine Queue)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-019, D-020, D-021, D-022, D-026]
    description: "Coadă pentru revizuire PII cu deschidere în DS-011. Carantină după eșecul inițial și trei reîncercări eșuate."

  - id: DS-005
    name: "Retenție & Listă de casare (Retention & Destruction list)"
    kind: screen
    status: draft
    roles: [admin]
    decisions: [D-002, D-020, D-027]
    description: "Termene calculate de la data aplicabilă conform Nomenclatorului. Grupare după marcajul C.S., prelungirea termenului și confirmarea casării pe loturi."

  - id: DS-006
    name: "Panou administrare (Admin panel)"
    kind: screen
    status: draft
    roles: [admin]
    decisions: [D-017, D-020, D-023]
    description: "Gestiune conturi și permisiuni pentru cititor, acordate explicit pe dosar fizic. Permisiunea individuală are prioritate."

  - id: DS-007
    name: "Panou principal / Statistici (Dashboard)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-019, D-020, D-021, D-026, D-027]
    description: "Indicatori volum arhivă (documente, spațiu, scanuri), contor alerte revizuire PII și carantină, scadențe de retenție, flux activitate recentă."

  - id: DS-008
    name: "Jurnal de audit (Audit Log viewer)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-002, D-020, D-024, D-027]
    description: "Jurnal de audit imuabil pentru accesări, modificări, partajare și casare. Păstrează dovezile după casare și permite filtrarea după operator și perioadă."

  - id: DS-009
    name: "Vizualizator link public (Public share link viewer)"
    kind: screen
    status: draft
    roles: [unauthenticated]
    decisions: [D-020, D-024]
    description: "Consultare și descărcare PDF pentru versiunea exactă selectată la partajare, prin link semnat cu expirare și parolă dacă a fost configurată."

  - id: DS-010
    name: "Autentificare (Login)"
    kind: screen
    status: draft
    roles: [unauthenticated]
    decisions: [D-017, D-018]
    description: "Ecran autentificare cu utilizator și parolă pentru personalul cabinetului notarial, mesaje de eroare exclusiv în limba română."

  - id: DS-011
    name: "Editor document & Anonimizare (Document Editor & Anonymization)"
    kind: screen
    status: draft
    roles: [admin, arhivar]
    decisions: [D-004, D-020, D-021, D-022, D-027]
    description: "Corectare OCR, revizuire PII obligatorie, marcaje manuale și generare PDF anonimizat. Confirmarea metadatelor și datei aplicabile de retenție înainte de salvare. Indicativ derivat din clasificarea editabilă."
