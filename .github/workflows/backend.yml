name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  phpunit-and-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run PHPUnit
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          export DB_PASSWORD="$(openssl rand -hex 32)"
          docker compose run --build --rm backend vendor/bin/phpunit
      - name: Lint the agent ledger
        run: python3 docs/agents/tools/ledger-lint.py
